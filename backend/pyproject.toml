[project]
name = "seo-agency-backend"
version = "0.1.0"
description = "Full-stack SEO Agency API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "cryptography>=44.0.0,<45.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    # LLM providers
    "anthropic>=0.42.0,<1.0.0",
    "openai>=1.60.0,<2.0.0",
    "google-genai>=1.0.0,<2.0.0",
    # SEO tools (from existing requirements.txt)
    "beautifulsoup4>=4.12.0,<5.0.0",
    "requests>=2.32.4,<3.0.0",
    "lxml>=6.0.2,<7.0.0",
    "validators>=0.22.0,<1.0.0",
    "urllib3>=2.6.3,<3.0.0",
    # NLP
    "spacy>=3.8.0,<4.0.0",
    "scikit-learn>=1.6.0,<2.0.0",
    "textstat>=0.7.0,<1.0.0",
    # Integrations
    "pytrends>=4.9.0,<5.0.0",
    "httpx>=0.28.0,<1.0.0",
    "aiofiles>=23.0.0,<25.0.0",
    # MCP
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
